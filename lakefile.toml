name = "froberg"
version = "0.2.0"
defaultTargets = ["Froberg", "Solution", "Challenge"]
# Bound per-process elaboration memory; these flags do not alter proof statements.
weakLeanArgs = ["-j1", "-DElab.async=false"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "8accc04827c389e678c3ef83e623b402e7480394"

[[lean_lib]]
name = "Froberg"

[[lean_lib]]
name = "OAI"

[[lean_lib]]
name = "Quartic"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Challenge"
