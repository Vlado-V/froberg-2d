version: "v0.4"

project:
  name: "Fröberg's conjecture through degree 2d in sufficiently many variables"
  description: >-
    For every positive generating degree d, there is a variable threshold
    depending only on d such that, over every infinite field and for every
    number of general degree-d generators, the quotient polynomial ring has
    Fröberg's predicted Hilbert function through degree 2d. The threshold is
    independent of both the field and the number of generators. The prediction
    uses positive truncation at the first nonpositive coefficient of
    (1-t^d)^r/(1-t)^n.
  authors: ["Vlado Vojdanovski"]
  license: "Apache-2.0"
  responsible_maintainers: ["Vlado Vojdanovski"]

classification:
  arxiv: ["math.AC"]

sources:
  - title: "Fröberg's conjecture through degree 2d in sufficiently many variables"
    authors: ["Vlado Vojdanovski"]
    id: "https://github.com/Vlado-V/froberg-2d/blob/aa15b6236a3ca6508c17d506a229676e67c2b1f4/Froberg_through_degree_2d.pdf"
    location: "Theorem 1.1"
    relationship: "formalizes"

related_formalizations:
